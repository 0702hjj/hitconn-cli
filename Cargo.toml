[package]
name = "hitconn-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Headless HITSZ Connect client and service manager"
repository = "https://github.com/YinMo19/hitconn-cli"

[[bin]]
name = "hitconn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
hitconn-core = { git = "https://github.com/YinMo19/hitconn-core.git", rev = "87675b5abcc0366dfacb118002b6432ae880e7e5" }
libc = "0.2.180"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
tun-rs = { version = "2.8.8", features = ["async"] }
