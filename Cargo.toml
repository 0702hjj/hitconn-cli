[package]
name = "hitconn-cli"
version = "0.3.4"
edition = "2024"
rust-version = "1.95"
description = "Headless HITSZ Connect client and service manager"
repository = "https://github.com/YinMo19/hitconn-cli"
license = "GPL-3.0-only"

[[bin]]
name = "hitconn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.23.0"
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5.65"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
hitconn-core = { git = "https://github.com/YinMo19/hitconn-core.git", rev = "e542d17d8644675dea06222eb6ee31f7489cd5ba" }
libc = "0.2.180"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rpassword = "7.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt"] }
x509-parser = "0.18.0"
zeroize = "1.8.2"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = "0.6.5"
tun-rs = { version = "2.8.8", features = ["async"] }
